[project]
name = "healthcore-api"
version = "0.1.0"
description = "HealthCore — Patient Incident Report API"
readme = "README.md"
authors = [
    { name = "Deimian Vásquez", email = "deimianvasquez@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.165.0",
    "healthcore-shared",
    "libpass[bcrypt]>=1.9.5.post0",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0.0",
    "resend>=2.55.1",
    "sqlmodel>=0.0.50",
    "tinydb>=4.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
healthcore-shared = { path = "../../packages/shared/python", editable = true }

[project.scripts]
healthcore-api = "app.api:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
